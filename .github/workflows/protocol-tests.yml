name: Portable protocol and provenance tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest==8.4.2 truststore==0.10.5 numpy==2.5.4
      - run: python -m pytest tests/test_benchmark.py tests/test_arax.py tests/test_biomedical.py tests/test_longcat_keys.py tests/test_retrieval.py -q
      - run: python -m compileall -q engram_poc scripts tests
      - run: python scripts/verify_artifacts.py

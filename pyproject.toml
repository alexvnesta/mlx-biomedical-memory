[project]
name = "mlx-biomedical-memory"
version = "0.1.0"
description = "Controlled tests of conditional latent memory and biomedical graph composition on Apple silicon"
requires-python = ">=3.12,<3.14"
dependencies = ["mlx==0.32.4", "mlx-lm==0.31.3", "truststore==0.10.5"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
engram-poc = "engram_poc.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engram_poc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
